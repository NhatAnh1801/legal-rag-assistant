services:
  qdrant:                          
    image: qdrant/qdrant:latest        
    container_name: vn_documents_qdrant     
    ports:
      - "6333:6333"                   
      - "6334:6334"
    volumes:
      - qdrant_storage:/data/qdrant/storage  
    restart: unless-stopped            

volumes:
  qdrant_storage:                      